name: ASTON OS Audit Staging Validation
on:
  push:
    branches: ["feat/audit-staging-harness-21x"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run test:safety
      - run: npm run test:security
      - run: npx tsc --noEmit --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --types @cloudflare/workers-types src/audit/staging-endpoint.ts src/audit/staging-route-guard.ts src/safety/chat-output-guard.ts src/security/mvsp-access.ts src/security/request-guard.ts src/auth.ts src/lib/identity.ts src/lib/sovereign.ts src/do/safety-interlock.ts
      - run: npx wrangler deploy --dry-run --config wrangler.staging.toml
