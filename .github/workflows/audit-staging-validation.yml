name: ASTON OS Audit Staging Validation
on:
  push:
    branches: ["feat/audit-staging-harness-21x"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run test:safety
      - run: npm run test:security
      - run: bash -n scripts/ots-anchor-r2.sh
      - run: npx tsc --noEmit --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --types @cloudflare/workers-types src/audit/staging-endpoint.ts src/audit/staging-route-guard.ts src/safety/chat-output-guard.ts src/security/mvsp-access.ts src/security/request-guard.ts src/security/audit-chain.ts src/security/audit-anchor.ts src/agents/governed.ts src/auth.ts src/lib/identity.ts src/lib/sovereign.ts src/do/safety-interlock.ts
      - run: npx wrangler deploy --dry-run --config wrangler.staging.toml
