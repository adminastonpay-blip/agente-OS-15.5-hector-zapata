name: Cloudflare CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and Wrangler dry run
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: TypeScript check
        run: npm run check

      - name: Validate production configuration bundle (dry run only)
        run: npx wrangler deploy --dry-run

      - name: Validate isolated staging configuration bundle (dry run only)
        run: npx wrangler deploy --dry-run --config wrangler.staging.toml

      - name: Validate isolated OTS verifier Worker bundle (dry run only)
        run: npx wrangler deploy --dry-run --config workers/ots-verifier/wrangler.toml
