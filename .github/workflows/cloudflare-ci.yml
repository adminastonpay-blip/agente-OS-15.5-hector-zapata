name: Cloudflare CI

on:
  push:
    branches:
      - main
      - feat/ai-control-gate
      - feat/rag-tenant-isolation
      - aston/centralized-inference-gate
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and Wrangler dry run
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: TypeScript check
        run: npm run check

      - name: AI Control Gate static guardrail
        run: npm run check-ai-guardrail

      - name: Security regression tests
        run: npm run test:security

      - name: AI Control Gate red-team tests
        run: npm run test:control-gate

      - name: Mission Token and anti-replay red-team tests
        run: npm run test:mission-token

      - name: Recovery Token Issuer red-team tests
        run: npm run test:token-issuer

      - name: Recovery action gate red-team tests
        run: npm run test:recovery-gate

      - name: Recovery end-to-end security chain
        run: npm run test:recovery-e2e

      - name: RAG tenant isolation red-team tests
        run: npm run test:rag-isolation

      - name: Native Ed25519 attestation tests
        run: npm run test:attestation

      - name: Tenant Trust Fabric RBAC tests
        run: npm run test:trust-fabric

      - name: Validate production configuration bundle (dry run only)
        run: npx wrangler deploy --dry-run

      - name: Validate isolated staging configuration bundle (dry run only)
        run: npx wrangler deploy --dry-run --config wrangler.staging.toml
