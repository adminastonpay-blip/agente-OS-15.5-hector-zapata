name: ASTON Engineering API CI

on:
  push:
    branches: ["feat/aston-engineering-readonly-api", "feat/aston-noc-d1-health-probe", "feat/aston-noc-auth-regression-guards", "feat/aston-noc-resource-inventory", "feat/aston-noc-d1-schema-observability", "feat/aston-noc-incident-feed"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Engineering API access, snapshot, D1, resource inventory and incident feed tests
        run: node --experimental-loader ./tests/ts-loader.mjs --test tests/engineering-overview.test.mts tests/engineering-health.test.mts tests/engineering-resource-inventory.test.mts
