name: Temporary npm lockfile resolution
on:
  push:
    branches: [chore/security-standardization]
    paths:
      - .github/workflows/lockfile-bootstrap.yml

permissions:
  contents: read

jobs:
  resolve-lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version: 22
      - name: Resolve the real npm dependency tree
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Emit lockfile for retrieval
        shell: bash
        run: |
          set -euo pipefail
          echo "LOCKFILE_BASE64_BEGIN"
          base64 -w0 package-lock.json
          echo
          echo "LOCKFILE_BASE64_END"
