name: SLSA Build Provenance
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version: 22
          cache: npm
      - name: Resolve dependencies and create an ephemeral lockfile
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript validation
        run: npm run check
      - name: Build production bundle without deployment
        run: npx wrangler deploy --dry-run --outdir dist/production
      - name: Build staging bundle without deployment
        run: npx wrangler deploy --dry-run --config wrangler.staging.toml --outdir dist/staging
      - name: Verify build outputs
        run: |
          set -euo pipefail
          test -n "$(find dist -type f -print -quit)"
      - name: Hash build artifacts
        id: hash
        run: |
          set -euo pipefail
          echo "hashes=$(find dist -type f -print0 | sort -z | xargs -0 sha256sum | base64 -w0)" >> "$GITHUB_OUTPUT"
      - name: Retain production and staging bundles
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: aston-os-worker-bundles
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Retain generated dependency lockfile for review
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: generated-npm-lockfile
          path: package-lock.json
          if-no-files-found: error
          retention-days: 30

  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      private-repository: true
      upload-assets: false
