name: ASTON External Audit Anchor (OpenTimestamps)
on:
  push:
    paths:
      - .github/workflows/audit-ots-anchor.yml
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aston-external-audit-anchor
  cancel-in-progress: false
jobs:
  stamp:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/audit-staging-harness-21x

      - name: Install OpenTimestamps client
        run: python -m pip install --disable-pip-version-check opentimestamps-client

      # AWS CLI v2 is installed from AWS's official installer. The staging script normalizes R2 endpoints to a secure HTTPS origin.
      # Ubuntu 24.04 runner repositories do not reliably provide awscli via apt.
      - name: Install AWS CLI v2 (official installer)
        run: |
          curl -fsSL https://awscli.amazonaws.com/v2/install.sh | sudo bash -s -- --system
          aws --version

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          jq --version

      - name: Check R2 credentials
        id: config
        env:
          R2_ENDPOINT: ${{ secrets.ASTON_R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.ASTON_AUDIT_R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.ASTON_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ASTON_R2_SECRET_ACCESS_KEY }}
        run: |
          if [[ -z "$R2_ENDPOINT" || -z "$R2_BUCKET" || -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" ]]; then
            echo "::error::One or more required R2 secrets are missing; refusing to report a successful audit."
            exit 1
          fi
          echo "All four required R2 secrets are present."

      - name: Validate audit script
        run: |
          bash -n scripts/ots-anchor-r2.sh
          command -v aws
          command -v ots
          command -v jq

      - name: Stamp and upgrade pending R2 checkpoints
        env:
          R2_ENDPOINT: ${{ secrets.ASTON_R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.ASTON_AUDIT_R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.ASTON_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ASTON_R2_SECRET_ACCESS_KEY }}
          OTS_BITCOIN_NODE: ${{ secrets.ASTON_OTS_BITCOIN_NODE }}
          AWS_DEFAULT_REGION: auto
        run: |
          bash scripts/ots-anchor-r2.sh
