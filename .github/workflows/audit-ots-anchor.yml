name: ASTON External Audit Anchor (OpenTimestamps)
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aston-external-audit-anchor
  cancel-in-progress: false
jobs:
  stamp:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/audit-staging-harness-21x
      - name: Install OpenTimestamps client
        run: python -m pip install --disable-pip-version-check opentimestamps-client
      - name: Check R2 credentials
        id: config
        env:
          R2_ENDPOINT: ${{ secrets.ASTON_R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.ASTON_AUDIT_R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.ASTON_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ASTON_R2_SECRET_ACCESS_KEY }}
        run: |
          if [[ -z "$R2_ENDPOINT" || -z "$R2_BUCKET" || -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" ]]; then
            echo "::warning::R2 secrets are not configured; no live timestamp was created."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Stamp and upgrade pending R2 checkpoints
        if: steps.config.outputs.configured == 'true'
        env:
          R2_ENDPOINT: ${{ secrets.ASTON_R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.ASTON_AUDIT_R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.ASTON_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ASTON_R2_SECRET_ACCESS_KEY }}
          OTS_BITCOIN_NODE: ${{ secrets.ASTON_OTS_BITCOIN_NODE }}
          AWS_DEFAULT_REGION: auto
        run: |
          sudo apt-get update
          sudo apt-get install -y awscli jq
          bash -n scripts/ots-anchor-r2.sh
          bash scripts/ots-anchor-r2.sh
