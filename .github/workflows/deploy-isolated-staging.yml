name: ASTON OS isolated staging deploy

on:
  workflow_dispatch:
    inputs:
      confirm_staging_deploy:
        description: "Type DEPLOY-STAGING to deploy only wrangler.staging.toml"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aston-os-isolated-staging
  cancel-in-progress: false

jobs:
  validate-and-deploy-staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validate explicit staging confirmation
        env:
          STAGING_CONFIRMATION: ${{ inputs.confirm_staging_deploy }}
        run: |
          set -euo pipefail
          if [ "$STAGING_CONFIRMATION" != "DEPLOY-STAGING" ]; then
            echo "::error::Confirmation missing or incorrect. Enter exactly DEPLOY-STAGING to continue."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      - name: Validate required staging secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUDIT_SECRET: ${{ secrets.AUDIT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$AUDIT_SECRET" || { echo "::error::Missing AUDIT_SECRET"; exit 1; }
          test "${#AUDIT_SECRET}" -ge 32 || { echo "::error::AUDIT_SECRET must contain at least 32 characters"; exit 1; }

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: TypeScript check
        run: npm run check

      - name: Security regression tests
        run: npm run test:security

      - name: Staging configuration dry run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --dry-run --config wrangler.staging.toml

      # This workflow references only the isolated staging config. It never deploys wrangler.toml.
      - name: Deploy isolated staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.staging.toml

      - name: Install staging-only audit secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUDIT_SECRET: ${{ secrets.AUDIT_SECRET }}
        run: |
          set -euo pipefail
          printf '%s' "$AUDIT_SECRET" | npx wrangler secret put AUDIT_SECRET --config wrangler.staging.toml
