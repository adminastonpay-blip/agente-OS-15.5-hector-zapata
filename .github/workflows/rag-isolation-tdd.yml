name: RAG Tenant Isolation TDD

on:
  push:
    branches:
      - feat/rag-tenant-isolation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rag-isolation-red-phase:
    name: Execute RAG isolation red-team tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run RAG tenant isolation TDD suite
        run: npm run test:rag-isolation
