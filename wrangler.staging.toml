# Isolated ASTON OS audit staging Worker.
# Configure AUDIT_SECRET (minimum 32 characters) in Cloudflare before testing the audit endpoint.
# This environment uses a dedicated staging D1 and Vectorize index only.
# It uses only dedicated staging D1, Vectorize, and the isolated Preview queue.
# R2 anchoring is disabled until the staging bucket is provisioned and verified.
name = "aston-os-21x-audit-staging"
main = "src/index.ts"
compatibility_date = "2026-11-03"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true
workers_dev = true # isolated workers.dev endpoint; staging route guard limits exposed paths

[ai]
binding = "AI"


# Dedicated ETL ingress/consumer for staging only. Never point this at the production queue.
[[queues.producers]]
binding = "ETL_QUEUE"
queue = "aston-global-queue-preview"

[[queues.consumers]]
queue = "aston-global-queue-preview"
max_batch_size = 5
max_batch_timeout = 5
max_retries = 3
max_concurrency = 1
\n# Dedicated D1 database for isolated RAG staging only.
[[d1_databases]]
binding = "DB"
database_name = "aston-rag-staging-db"
database_id = "457d72d6-388b-4dad-bdd0-b32d3e905e00"
migrations_dir = "migrations"

# Dedicated Vectorize index for isolated RAG staging only.
[[vectorize]]
binding = "VECTORIZE"
index_name = "aston-rag-staging-index"

[[durable_objects.bindings]]
name = "SAFETY"
class_name = "SafetyInterlock"

# The new Worker name gives this staging deployment isolated DO namespaces.
[exports.SafetyInterlock]
type = "durable-object"
storage = "sqlite"

[vars]
CHAT_MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8"
EMBED_MODEL = "@cf/baai/bge-m3"
DEPLOY_PROFILE = "21.6.3-audit-staging"
AUDIT_ENABLED = "true"
CHAT_SAFETY_ENFORCED = "true"

[observability]
enabled = true
head_sampling_rate = 1.0

[observability.traces]
enabled = true
