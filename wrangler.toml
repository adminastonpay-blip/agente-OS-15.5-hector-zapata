# ASTON OS — Cloudflare Worker
# DO lifecycle uses declarative `exports` (Cloudflare 2026 best practice).
# Do NOT mix `exports` with legacy `[[migrations]]` — they are mutually exclusive.
# This avoids error 10074 (re-applying new_sqlite_classes on existing classes).

name = "agente-os-15-5-hector-zapata"
main = "src/index.ts"
compatibility_date = "2026-11-03"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true
workers_dev = true

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "sos-db"
database_id = "04ef0fcc-cf13-494c-8752-a300d6e6fe90"

[[queues.producers]]
binding = "ETL_QUEUE"
queue = "aston-global-queue"

[[previews.queues.producers]]
binding = "ETL_QUEUE"
queue = "aston-global-queue-preview"

# Cloudflare Workers Preview must use isolated staging data resources.
# Keep production bindings above unchanged; Preview overrides DB and Vectorize.
[previews.vars]
AI_GATEWAY_ID = "sovereign-gateway"
CHAT_MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8"
EMBED_MODEL = "@cf/baai/bge-m3"
DEPLOY_PROFILE = "21.6.3-cf-audit-preview"

[previews.ai]
binding = "AI"

[[previews.d1_databases]]
binding = "DB"
database_name = "aston-rag-staging-db"
database_id = "457d72d6-388b-4dad-bdd0-b32d3e905e00"
migrations_dir = "migrations"

[[previews.durable_objects.bindings]]
name = "SESSION"
class_name = "SessionMemory"

[[previews.durable_objects.bindings]]
name = "GRAPH"
class_name = "GraphResolver"

[[previews.durable_objects.bindings]]
name = "SUPERVISOR"
class_name = "Supervisor"

[[previews.durable_objects.bindings]]
name = "AGENT"
class_name = "AgentNode"

[[previews.durable_objects.bindings]]
name = "SIMULATION"
class_name = "SimulationTwin"

[[previews.durable_objects.bindings]]
name = "MISSION"
class_name = "MissionBrain"

[[previews.durable_objects.bindings]]
name = "SAFETY"
class_name = "SafetyInterlock"

[[previews.durable_objects.bindings]]
name = "REPLAY_GUARD"
class_name = "ReplayGuard"

[[previews.vectorize]]
binding = "VECTORIZE"
index_name = "aston-rag-staging-index"

# —— Durable Object bindings (runtime access via env.*) ——
[[durable_objects.bindings]]
name = "SESSION"
class_name = "SessionMemory"

[[durable_objects.bindings]]
name = "GRAPH"
class_name = "GraphResolver"

[[durable_objects.bindings]]
name = "SUPERVISOR"
class_name = "Supervisor"

[[durable_objects.bindings]]
name = "AGENT"
class_name = "AgentNode"

[[durable_objects.bindings]]
name = "SIMULATION"
class_name = "SimulationTwin"

[[durable_objects.bindings]]
name = "MISSION"
class_name = "MissionBrain"

[[durable_objects.bindings]]
name = "SAFETY"
class_name = "SafetyInterlock"

[[durable_objects.bindings]]
name = "REPLAY_GUARD"
class_name = "ReplayGuard"

# —— Declarative DO class lifecycle (replaces [[migrations]]) ——
[exports.SessionMemory]
type = "durable-object"
storage = "sqlite"

[exports.GraphResolver]
type = "durable-object"
storage = "sqlite"

[exports.Supervisor]
type = "durable-object"
storage = "sqlite"

[exports.AgentNode]
type = "durable-object"
storage = "sqlite"

[exports.SimulationTwin]
type = "durable-object"
storage = "sqlite"

[exports.MissionBrain]
type = "durable-object"
storage = "sqlite"

[exports.SafetyInterlock]
type = "durable-object"
storage = "sqlite"

[exports.ReplayGuard]
type = "durable-object"
storage = "sqlite"

[vars]
AI_GATEWAY_ID = "sovereign-gateway"
CHAT_MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8"
EMBED_MODEL = "@cf/baai/bge-m3"
DEPLOY_PROFILE = "21.6.3-cf-audit"
SHOPIFY_ALLOWED_ORIGINS = "https://m1m0d3-ru.myshopify.com"

# Cloudflare Workflow registration (separate from Durable Object lifecycle).
[[workflows]]
name = "aston-recovery-workflow"
binding = "RECOVERY_WORKFLOW"
class_name = "RecoveryWorkflow"
