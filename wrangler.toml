name = "agente-os-15-5-hector-zapata"
main = "src/index.ts"
compatibility_date = "2026-11-03"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true
workers_dev = true

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "SESSION"
class_name = "SessionMemory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionMemory"]

[vars]
AI_GATEWAY_ID = "sovereign-gateway"
CHAT_MODEL = "@cf/meta/llama-3.1-8b-instruct"
EMBED_MODEL = "@cf/baai/bge-m3"
DEPLOY_PROFILE = "minimal"
