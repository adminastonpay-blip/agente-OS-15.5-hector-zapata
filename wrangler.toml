name = "agente-os-15-5-hector-zapata"
main = "src/index.ts"
compatibility_date = "2026-11-03"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true
workers_dev = true

[ai]
binding = "AI"

# ---- D1 (already on this account) ----
[[d1_databases]]
binding = "DB"
database_name = "sos-db"
database_id = "04ef0fcc-cf13-494c-8752-a300d6e6fe90"

# ---- Queue (already on this account) ----
[[queues.producers]]
binding = "ETL_QUEUE"
queue = "aston-global-queue"

# ---- Durable Objects (must match production bindings) ----
[[durable_objects.bindings]]
name = "SESSION"
class_name = "SessionMemory"

[[durable_objects.bindings]]
name = "GRAPH"
class_name = "GraphResolver"

[[durable_objects.bindings]]
name = "SUPERVISOR"
class_name = "Supervisor"

[[durable_objects.bindings]]
name = "AGENT"
class_name = "AgentNode"

[[durable_objects.bindings]]
name = "SIMULATION"
class_name = "SimulationTwin"

[[durable_objects.bindings]]
name = "MISSION"
class_name = "MissionBrain"

[[durable_objects.bindings]]
name = "SAFETY"
class_name = "SafetyInterlock"

# Migration history MUST stay in order and keep past tags.
# Remote is already at tag v2 — do not re-list SessionMemory under a new tag.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionMemory"]

[[migrations]]
tag = "v2"
new_sqlite_classes = [
  "GraphResolver",
  "Supervisor",
  "AgentNode",
  "SimulationTwin",
  "MissionBrain",
  "SafetyInterlock",
]

[vars]
AI_GATEWAY_ID = "sovereign-gateway"
CHAT_MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8"
EMBED_MODEL = "@cf/baai/bge-m3"
DEPLOY_PROFILE = "21.0-edge"
