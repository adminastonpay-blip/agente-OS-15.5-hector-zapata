name = "agente-os-15-5-hector-zapata"
main = "src/index.ts"
compatibility_date = "2026-11-03"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true
workers_dev = true

# AI binding (used by the code)
[ai]
binding = "AI"

# D1 used by the application
[[d1_databases]]
binding = "DB"
database_name = "sos-db"
database_id = "04ef0fcc-cf13-494c-8752-a300d6e6fe90"

# Queue producer used by the code
[[queues.producers]]
binding = "ETL_QUEUE"
queue = "aston-global-queue"

# Durable Objects temporarily removed.
# Remote has conflicting migration history for SessionMemory (error 10074).
# Once this deploy succeeds we will re-add them one by one using the correct exports or matching migration tags.

[vars]
AI_GATEWAY_ID = "sovereign-gateway"
CHAT_MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8"
EMBED_MODEL = "@cf/baai/bge-m3"
DEPLOY_PROFILE = "21.6.2-envelope"
